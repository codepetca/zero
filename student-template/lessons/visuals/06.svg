<svg xmlns="http://www.w3.org/2000/svg" width="600" height="310" viewBox="0 0 600 310" role="img" aria-labelledby="title desc">
<title id="title">Quiz with a Counter object</title><desc id="desc">Schematic quiz layout after Reset: question, empty answer, Check and Reset buttons, Attempts: 0. A side note shows Counter.value() returning 0; Main updates the label. Platform appearance varies.</desc>
<rect width="600" height="310" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><rect x="24" y="18" width="360" height="274" rx="8" fill="#fff" stroke="#c7d2dc"/><text x="44" y="56" font-size="23" fill="#243444">What is 2 + 3?</text><rect x="44" y="76" width="320" height="38" rx="8" fill="#fff" stroke="#c7d2dc"/><rect x="44" y="130" width="100" height="39" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="58" y="157" font-size="20" fill="#243444">Check</text><rect x="44" y="181" width="100" height="39" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="58" y="208" font-size="20" fill="#243444">Reset</text><text x="44" y="267" font-size="20" fill="#243444">Attempts: 0</text><rect x="400" y="86" width="176" height="130" rx="8" fill="#eef4fa" stroke="#c7d2dc"/><text x="415" y="119" font-size="19" font-weight="bold" fill="#243444">Counter</text><text x="415" y="157" font-size="18" fill="#243444">value() → 0</text><text x="415" y="190" font-size="15" fill="#243444">Main updates label</text></g></svg>
