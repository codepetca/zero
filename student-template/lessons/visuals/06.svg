<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
<title id="title">Let Counter own the number</title><desc id="desc">Counter showing 0 above +1 and Reset buttons, with a separate Counter object. Schematic control layout; platform appearance varies.</desc>
<rect width="600" height="260" rx="16" fill="#f4f7fa"/>
<g font-family="system-ui, sans-serif"><rect x="24" y="24" width="552" height="212" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="48" y="68" font-size="30" fill="#243444" font-weight="normal">0</text><rect x="48" y="90" width="76" height="40" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="60" y="117" font-size="20" fill="#243444" font-weight="normal">+1</text><rect x="48" y="140" width="100" height="40" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="60" y="167" font-size="20" fill="#243444" font-weight="normal">Reset</text><rect x="260" y="65" width="264" height="130" rx="8" fill="#eef4fa" stroke="#c7d2dc"/><text x="280" y="100" font-size="24" fill="#243444" font-weight="bold">Counter object</text><text x="280" y="138" font-size="22" fill="#243444" font-weight="normal">value() → 0</text><text x="280" y="175" font-size="18" fill="#243444" font-weight="normal">Main updates the label</text></g></svg>
