<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">First study question answered correctly</title><desc id="desc">Schematic layout: Question 1 of 3, answer 5, disabled Check, enabled Next, Restart, Correct feedback, Attempts: 2 and Score: 1. Platform appearance varies.</desc>
<rect width="600" height="370" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><rect x="24" y="18" width="552" height="334" rx="8" fill="#fff" stroke="#c7d2dc"/><text x="44" y="55" font-size="23" fill="#243444">Question 1 of 3: What is 2 + 3?</text><rect x="44" y="72" width="512" height="37" rx="8" fill="#fff" stroke="#c7d2dc"/><text x="56" y="99" font-size="20" fill="#243444">5</text><rect x="44" y="124" width="100" height="36" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="58" y="149" font-size="19" fill="#687582">Check</text><rect x="44" y="172" width="100" height="36" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="58" y="197" font-size="19" fill="#243444">Next</text><rect x="44" y="220" width="104" height="36" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="58" y="245" font-size="19" fill="#243444">Restart</text><text x="44" y="285" font-size="19" fill="#243444">Correct! 2 + 3 equals 5.</text><text x="44" y="313" font-size="19" fill="#243444">Attempts: 2</text><text x="44" y="341" font-size="19" fill="#243444">Score: 1</text></g></svg>
