<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">First study checkpoint</title><desc id="desc">One question answered correctly: input and checking disabled, Score: 1. Schematic layout.</desc><rect width="600" height="300" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><rect x="24" y="18" width="552" height="264" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="44" y="47" font-size="21" font-weight="normal" fill="#243444">What is the value of 7 / 2</text><text x="44" y="72" font-size="21" font-weight="normal" fill="#243444">when both numbers are ints?</text><rect x="44" y="85" width="512" height="34" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="56" y="109" font-size="20" font-weight="normal" fill="#8b949e">3</text><rect x="44" y="133" width="164" height="34" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="56" y="157" font-size="20" font-weight="normal" fill="#8b949e">Check answer</text><text x="44" y="201" font-size="20" font-weight="normal" fill="#243444">Correct! Integer division drops</text><text x="44" y="226" font-size="20" font-weight="normal" fill="#243444">the fractional part.</text><text x="44" y="265" font-size="24" font-weight="normal" fill="#243444">Score: 1</text></g></svg>
