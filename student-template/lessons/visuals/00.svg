<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
<title id="title">A greeting you can change</title><desc id="desc">Hello, Java! after saving and rerunning. Schematic control layout; platform appearance varies.</desc>
<rect width="600" height="260" rx="16" fill="#f4f7fa"/>
<g font-family="system-ui, sans-serif"><rect x="24" y="24" width="552" height="212" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="48" y="74" font-size="30" fill="#243444" font-weight="normal">Hello, Java!</text></g></svg>
