<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
<title id="title">Check one answer</title><desc id="desc">Question What is 2 + 3?, answer 5, Check button, Correct! feedback. Schematic control layout; platform appearance varies.</desc>
<rect width="600" height="260" rx="16" fill="#f4f7fa"/>
<g font-family="system-ui, sans-serif"><rect x="24" y="24" width="552" height="212" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="48" y="64" font-size="26" fill="#243444" font-weight="normal">What is 2 + 3?</text><rect x="48" y="84" width="504" height="40" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="60" y="112" font-size="22" fill="#243444" font-weight="normal">5</text><rect x="48" y="144" width="100" height="40" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="60" y="171" font-size="20" fill="#243444" font-weight="normal">Check</text><text x="48" y="224" font-size="22" fill="#243444" font-weight="normal">Correct!</text></g></svg>
