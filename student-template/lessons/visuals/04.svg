<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
<title id="title">Quiz with an attempts counter</title><desc id="desc">Schematic quiz layout after two checks: What is 2 + 3?, answer 4, Check, Try again., Attempts: 2. Platform appearance varies.</desc>
<rect width="600" height="300" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><rect x="24" y="18" width="552" height="264" rx="8" fill="#fff" stroke="#c7d2dc"/><text x="44" y="56" font-size="25" fill="#243444">What is 2 + 3?</text><rect x="44" y="76" width="512" height="38" rx="8" fill="#fff" stroke="#c7d2dc"/><text x="56" y="103" font-size="21" fill="#243444">4</text><rect x="44" y="130" width="100" height="39" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="58" y="157" font-size="20" fill="#243444">Check</text><text x="44" y="214" font-size="21" fill="#243444">Try again.</text><text x="44" y="257" font-size="21" fill="#243444">Attempts: 2</text></g></svg>
