<svg xmlns="http://www.w3.org/2000/svg" width="600" height="288" viewBox="0 0 600 288" role="img" aria-labelledby="title desc">
<title id="title">Move the player you wrote</title><desc id="desc">An AliceBlue 640 by 400 game canvas shows a blue player square at 40,180 and a right arrow indicating movement.</desc>
<rect width="600" height="288" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif" transform="translate(95 16) scale(.64)"><rect width="640" height="400" fill="#f0f8ff" stroke="#c7d2dc"/><text x="20" y="30" font-size="20" fill="#2f4f4f">Click the canvas, then hold the arrow keys.</text><rect x="40" y="180" width="24" height="24" fill="#6495ed"/><path d="M84 192h90m-13-12 13 12-13 12" fill="none" stroke="#683bef" stroke-width="5"/></g></svg>
