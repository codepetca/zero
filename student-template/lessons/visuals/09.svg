<svg xmlns="http://www.w3.org/2000/svg" width="600" height="288" viewBox="0 0 600 288" role="img" aria-labelledby="title desc"><title id="title">First canvas checkpoint</title><desc id="desc">Full 640×400 canvas scaled together: blue player at 40,180; gold coin at 220,180.</desc><rect width="600" height="288" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><g transform="translate(95 16) scale(0.64)"><rect x="0" y="0" width="640" height="400" rx="0" fill="#f0f8ff" stroke="#c7d2dc"/><text x="20" y="30" font-size="20" font-weight="normal" fill="#2f4f4f">Click the canvas, then hold the arrow keys.</text><rect x="40" y="180" width="24" height="24" rx="0" fill="#6495ed" stroke="#c7d2dc"/><rect x="220" y="180" width="24" height="24" rx="0" fill="#ffd700" stroke="#c7d2dc"/></g></g></svg>
