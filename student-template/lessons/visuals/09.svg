<svg xmlns="http://www.w3.org/2000/svg" width="600" height="288" viewBox="0 0 600 288" role="img" aria-labelledby="title desc">
<title id="title">Collect one coin</title><desc id="desc">The blue player moves toward one gold coin on a canvas; canvas text reads Score: 0.</desc>
<rect width="600" height="288" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif" transform="translate(95 16) scale(.64)"><rect width="640" height="400" fill="#f0f8ff" stroke="#c7d2dc"/><text x="20" y="30" font-size="20" fill="#2f4f4f">Click the canvas, then hold the arrow keys.</text><text x="20" y="60" font-size="20" fill="#2f4f4f">Score: 0</text><rect x="40" y="180" width="24" height="24" fill="#6495ed"/><rect x="220" y="180" width="24" height="24" fill="#ffd700"/></g></svg>
