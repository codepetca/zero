<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Local check, then optional original sharing</title><desc id="desc">The same ScoreDisplay source serves a study quiz and coin game locally. A separate original game points toward optional ZeroHub sharing.</desc><rect width="600" height="280" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif" fill="#243444"><text x="28" y="43" font-size="25" font-weight="bold">Check one component in two apps</text><rect x="25" y="65" width="254" height="94" rx="8" fill="white" stroke="#c7d2dc"/><rect x="321" y="65" width="254" height="94" rx="8" fill="white" stroke="#c7d2dc"/><text x="45" y="104" font-size="22">Study quiz</text><text x="45" y="137" font-size="19">Score: 1</text><text x="341" y="104" font-size="22">Coin game</text><text x="341" y="137" font-size="19">Score: 1</text><path d="M290 110h21" stroke="#683bef" stroke-width="3"/><text x="29" y="206" font-size="19">Practice: your Coin game badge</text><path d="M357 200h34m-8-8 8 8-8 8" fill="none" stroke="#683bef" stroke-width="2"/><text x="405" y="206" font-size="19">Tutorial practice</text><text x="29" y="243" font-size="17">Tutorial copies expected · original extension optional</text></g></svg>
