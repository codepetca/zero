<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Share with ZeroHub</title><desc id="desc">Prepare an ordinary Java project, build a preview, upload the folder and read automatic checks. Passing versions are listed with contributor credit.</desc><rect width="600" height="280" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif" fill="#243444"><text x="30" y="44" font-size="26" font-weight="bold">Your component → another student's app</text><text x="30" y="82" font-size="20">Ordinary Java · one library · an exact version</text><g fill="white" stroke="#c7d2dc"><rect x="24" y="110" width="126" height="54" rx="8"/><rect x="166" y="110" width="126" height="54" rx="8"/><rect x="308" y="110" width="126" height="54" rx="8"/><rect x="450" y="110" width="126" height="54" rx="8"/></g><g font-size="22" font-weight="bold"><text x="40" y="145">Prepare</text><text x="192" y="145">Build</text><text x="330" y="145">Upload</text><text x="470" y="145">Checks</text></g><g font-size="20"><text x="151" y="143">→</text><text x="293" y="143">→</text><text x="435" y="143">→</text><text x="30" y="213">Pass → listed automatically, with GitHub credit</text><text x="30" y="246">Fix → upload again; published fixes get a new version</text></g></g></svg>