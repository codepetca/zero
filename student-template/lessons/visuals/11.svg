<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc"><title id="title">Local improvement before a contribution</title><desc id="desc">Build then check then export local files then propose a source pull request. Human acceptance and library publication are separate decisions.</desc><rect width="600" height="280" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif"><text x="30" y="42" font-size="26" font-weight="bold" fill="#243444">First: build and read the checks</text><text x="30" y="80" font-size="22" font-weight="normal" fill="#243444">Bold caption · same values and fill</text><rect x="24" y="108" width="126" height="54" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="42" y="143" font-size="23" font-weight="bold" fill="#243444">Build</text><text x="151" y="142" font-size="21" font-weight="normal" fill="#243444">→</text><rect x="166" y="108" width="126" height="54" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="184" y="143" font-size="23" font-weight="bold" fill="#243444">Check</text><text x="293" y="142" font-size="21" font-weight="normal" fill="#243444">→</text><rect x="308" y="108" width="126" height="54" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="326" y="143" font-size="23" font-weight="bold" fill="#243444">Export</text><text x="435" y="142" font-size="21" font-weight="normal" fill="#243444">→</text><rect x="450" y="108" width="126" height="54" rx="8" fill="#ffffff" stroke="#c7d2dc"/><text x="468" y="143" font-size="23" font-weight="bold" fill="#243444">PR</text><rect x="24" y="188" width="552" height="72" rx="8" fill="#eef4fa" stroke="#c7d2dc"/><text x="44" y="217" font-size="23" font-weight="bold" fill="#243444">Human acceptance is separate.</text><text x="44" y="245" font-size="19" font-weight="normal" fill="#243444">Current checks + independent review; later release.</text></g></svg>
