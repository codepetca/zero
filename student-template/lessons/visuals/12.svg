<svg xmlns="http://www.w3.org/2000/svg" width="600" height="284" viewBox="0 0 600 284" role="img" aria-labelledby="title desc">
<title id="title">First checkpoint: show a sprite and play a sound</title><desc id="desc">Purple robot on an AliceBlue canvas above Play sound and Plays: 2 controls. The sprite is a simplified illustration of the supplied image.</desc>
<rect width="600" height="284" rx="16" fill="#f4f7fa"/>
<g font-family="system-ui, sans-serif"><g transform="translate(108 16) scale(0.6)"><rect x="0" y="0" width="640" height="360" rx="0" fill="#f0f8ff" stroke="#c7d2dc"/><text x="80" y="60" font-size="20" fill="#2f4f4f" font-weight="normal">Your image. Your sound.</text><g transform="translate(80 100) scale(3)"><rect x="6" y="8" width="20" height="18" rx="0" fill="#6341e6" stroke="#6341e6"/><rect x="14" y="3" width="4" height="5" rx="0" fill="#6341e6" stroke="#6341e6"/><rect x="14" y="1" width="4" height="3" rx="0" fill="#ffd700" stroke="#ffd700"/><rect x="9" y="11" width="4" height="4" rx="0" fill="#ffffff" stroke="#ffffff"/><rect x="19" y="11" width="4" height="4" rx="0" fill="#ffffff" stroke="#ffffff"/><rect x="11" y="20" width="10" height="3" rx="0" fill="#ffd700" stroke="#ffd700"/><rect x="7" y="26" width="5" height="4" rx="0" fill="#6341e6" stroke="#6341e6"/><rect x="20" y="26" width="5" height="4" rx="0" fill="#6341e6" stroke="#6341e6"/></g></g><rect x="118" y="240" width="142" height="40" rx="8" fill="#f1f3f5" stroke="#c7d2dc"/><text x="130" y="267" font-size="20" fill="#243444" font-weight="normal">Play sound</text><text x="272" y="268" font-size="22" fill="#243444" font-weight="normal">Plays: 2</text></g></svg>
