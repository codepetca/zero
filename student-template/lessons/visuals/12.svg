<svg xmlns="http://www.w3.org/2000/svg" width="600" height="284" viewBox="0 0 600 284" role="img" aria-labelledby="title desc"><title id="title">Media in the same Coin game</title><desc id="desc">A small robot sprite approaches three gold coins on an AliceBlue canvas. Below it, native controls show Score: 0, Chimes: 0 and Restart.</desc><rect width="600" height="284" rx="16" fill="#f4f7fa"/><g font-family="system-ui, sans-serif" transform="translate(95 10) scale(.64)"><rect width="640" height="360" fill="#f0f8ff" stroke="#c7d2dc"/><text x="20" y="30" font-size="20" fill="#2f4f4f">Click the canvas, then hold the arrow keys.</text><g transform="translate(40 180) scale(.75)"><rect x="6" y="8" width="20" height="18" fill="#6341e6"/><rect x="14" y="2" width="4" height="6" fill="#6341e6"/><rect x="9" y="11" width="4" height="4" fill="white"/><rect x="19" y="11" width="4" height="4" fill="white"/><rect x="11" y="20" width="10" height="3" fill="#ffd700"/></g><rect x="220" y="180" width="24" height="24" fill="#ffd700"/><rect x="420" y="80" width="24" height="24" fill="#ffd700"/><rect x="540" y="300" width="24" height="24" fill="#ffd700"/></g><g font-family="system-ui, sans-serif" fill="#243444"><text x="95" y="268" font-size="18">Score: 0</text><text x="205" y="268" font-size="18">Chimes: 0</text><rect x="350" y="239" width="94" height="38" rx="7" fill="#fff" stroke="#c7d2dc"/><text x="363" y="265" font-size="18">Restart</text></g></svg>
