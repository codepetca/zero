name: Library checker acceptance

on:
  pull_request:
    paths:
      - 'hub/checker/**'
      - 'sharing/library-checker.mjs'
      - 'sharing/test/library-checker*.test.mjs'
      - 'extension/src/sharing/contracts.js'
      - '.github/workflows/library-checker-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build fixed reviewed checker image before test inputs
        run: node hub/checker/build-image.mjs amd64
      - name: Verify current contract and actual offline Linux checks
        env:
          ZERO_DOCKER_TEST: '1'
        run: node --test hub/checker/test/validation.test.mjs hub/checker/test/jvm-boundary.test.mjs hub/checker/test/docker.test.mjs sharing/test/library-checker*.test.mjs
