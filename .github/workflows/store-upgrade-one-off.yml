# Temporary branch-only diagnostic; never merge this workflow.
name: One-off Store 0.5.58 to 0.5.63 upgrade proof
on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            student-template/.mvn/wrapper/maven-wrapper.properties
            extension/src/web-export/toolchain-lock.json
      - name: Bind tested payload source to reviewed release source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '51b722eaf9beba3855a6492cbf73927c6b9bc8f6'
          $source = (git rev-parse HEAD).Trim()
          $allowed = @('.github/workflows/windows-native.yml', '.github/workflows/store-upgrade-one-off.yml')
          $changed = @(git diff --name-only $base $source)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 2 -or @($changed | Where-Object { $_ -notin $allowed }).Count -ne 0) { throw 'Only the two temporary test workflows may differ from the reviewed release.' }
          git diff --quiet $base $source -- . ':(exclude).github/workflows/windows-native.yml' ':(exclude).github/workflows/store-upgrade-one-off.yml'
          if ($LASTEXITCODE -ne 0 -or (git status --porcelain)) { throw 'Packaged payload source differs from the reviewed release or is dirty.' }
          $definition = Get-Content -LiteralPath 'release/kit.json' -Raw | ConvertFrom-Json
          if ($definition.kitVersion -ne '0.5.63' -or $definition.publication.status -ne 'local') { throw 'Expected the unpublished reviewed 0.5.63 release definition.' }
          [ordered]@{
            schema = 1; canonicalSourceRevision = $base; testSourceRevision = $source
            packagedSourceEquivalent = $true; differingPaths = $changed
            eventName = $env:GITHUB_EVENT_NAME; runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT; runnerImage = $env:ImageOS
            limits = 'Only temporary workflow files differ; local same-certificate MSIX test, not Store delivery.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'source-binding.json') -Encoding utf8
      - name: Restore pinned tools and build verified kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable GitHub-hosted runner required.' }
          npm ci
          dotnet tool restore
          npm run package
          npm run verify:kit
          npm run test:msix
      - name: Build clean-source Store candidate
        id: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packager = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe'
          if (-not (Test-Path -LiteralPath $packager -PathType Leaf)) { throw 'Windows SDK 10.0.26100.0 x64 MakeAppx.exe is required.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $packager
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') { throw 'MakeAppx.exe must have a valid Microsoft signature.' }
          $version = (Get-Item -LiteralPath $packager).VersionInfo
          if ($version.FileMajorPart -ne 10 -or $version.FileMinorPart -ne 0 -or $version.FileBuildPart -ne 26100) { throw 'Unexpected MakeAppx.exe version.' }
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Candidate requires the exact clean workflow checkout.' }
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist/msix'
          if (Test-Path -LiteralPath $output) { throw 'Candidate output already exists.' }
          npm run package:windows:msix -- --packager "$packager" --kind makeappx --channel store --output "$output"
          $kit = Get-Content -LiteralPath 'dist/release.json' -Raw | ConvertFrom-Json
          $receipt = Get-Content -LiteralPath (Join-Path $output 'build-msix.json') -Raw | ConvertFrom-Json
          $definition = Get-Content -LiteralPath 'release/kit.json' -Raw | ConvertFrom-Json
          $packageVersion = node --input-type=module -e "import {msixVersion} from './scripts/windows-msix.mjs'; console.log(msixVersion(process.argv[1]));" $definition.kitVersion
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map the checked-out kit version to a Store version.' }
          if ($kit.kitVersion -ne $definition.kitVersion -or $receipt.kitVersion -ne $kit.kitVersion -or $receipt.packageVersion -ne $packageVersion -or $receipt.sourceRevision -ne $source -or $receipt.sourceDirty -ne $false -or $receipt.kind -ne 'msix-store' -or $receipt.kit.sha256 -ne $kit.assets.kit.sha256 -or $receipt.packager.sha256 -ne (Get-FileHash -LiteralPath $packager -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Candidate receipt does not bind the required source, kit, version and packager.' }
          $artifact = Join-Path $output ("Zero-{0}-msix-store-x64.msix" -f $definition.kitVersion)
          if ($receipt.artifact.filename -ne (Split-Path $artifact -Leaf) -or $receipt.artifact.sha256 -ne (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Candidate hash or filename does not match its receipt.' }
          "path=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "kit-version=$($definition.kitVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package-version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download pinned previous candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zero-windows-msix-41134687731-1
          run-id: 41134687731
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zero-previous-msix
      - name: Verify previous candidate bytes
        id: previous
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'zero-previous-msix') -Recurse -File -Filter 'Zero-0.5.58-msix-store-x64.msix')
          if ($files.Count -ne 1 -or (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '94c5d45ebf44ba6f3d3f5abe3f5c6a2dd7ea33a3f1a3e8a6710054226676cf22') { throw 'Previous candidate missing or hash mismatch.' }
          "path=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $receipts = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'zero-previous-msix') -Recurse -File -Filter 'build-msix.json')
          if ($receipts.Count -ne 1) { throw 'Expected exactly one previous build receipt.' }
          "receipt=$($receipts[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Copy-Item -LiteralPath $receipts[0].FullName -Destination (Join-Path $env:GITHUB_WORKSPACE 'dist/msix/previous-build-msix.json')
      - name: Exercise first-run and upgrade on disposable runner
        shell: powershell
        timeout-minutes: 30
        env:
          OLD_PACKAGE: ${{ steps.previous.outputs.path }}
          OLD_RECEIPT: ${{ steps.previous.outputs.receipt }}
          NEW_PACKAGE: ${{ steps.candidate.outputs.path }}
          NEW_KIT_VERSION: ${{ steps.candidate.outputs.kit-version }}
          NEW_PACKAGE_VERSION: ${{ steps.candidate.outputs.package-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-msix-upgrade.ps1 -OldPackage $env:OLD_PACKAGE -OldBuildReceipt $env:OLD_RECEIPT -NewPackage $env:NEW_PACKAGE -NewBuildReceipt (Join-Path $env:GITHUB_WORKSPACE 'dist/msix/build-msix.json') -ExpectedNewSourceRevision $env:GITHUB_SHA -ExpectedNewKitVersion $env:NEW_KIT_VERSION -ExpectedNewPackageVersion $env:NEW_PACKAGE_VERSION -Receipt (Join-Path $env:RUNNER_TEMP 'zero-upgrade-report.json')
      - name: Retain candidate and sanitized upgrade receipt
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-store-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.candidate.outputs.path }}
            dist/msix/build-msix.json
            dist/msix/previous-build-msix.json
            dist/release.json
            ${{ runner.temp }}/source-binding.json
            ${{ runner.temp }}/zero-upgrade-report.json
