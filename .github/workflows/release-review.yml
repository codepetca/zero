name: Release checks and preparation
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Prepare Zero {0} [{1}]', inputs.version, inputs.request_id) || 'Zero release checks' }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Exact new local kit version on the selected source ref
        required: true
        type: string
      request_id:
        description: Optional publisher correlation ID; leave blank for manual preparation
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
  review:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Xvfb has no physical GPU. Avoid Mesa/LLVM driver crashes while preserving
    # all JavaFX behavior assertions, native toolkit startup and finite timeouts.
    env:
      JAVA_TOOL_OPTIONS: -Dprism.order=sw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            student-template/.mvn/wrapper/maven-wrapper.properties
            extension/src/web-export/toolchain-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Snapshot the selected hosted JDK trust store before evidence collection
        run: node scripts/ci-browser.mjs prepare-jdk
      - name: Install website dependencies
        if: needs.scope.outputs.website == 'true'
        run: npm ci --prefix website
      - name: CI selection, gate, browser provisioning and Dev contracts
        run: node --test scripts/ci-*.test.mjs scripts/zero-dev.test.mjs
      - name: Check version and immutable release boundary
        id: release
        run: node scripts/release-review.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
      - name: Configuration and release guard tests
        run: |
          npm run check
      - name: Release guard tests
        if: needs.scope.outputs.source == 'true'
        run: npm run test:release
      - name: Extension and standalone starter tests
        if: needs.scope.outputs.source == 'true'
        run: xvfb-run -a npm test
      - name: GitHub registry and immutable publication contracts
        if: needs.scope.outputs.sharing == 'true'
        run: npm run test:sharing
      - name: Exact Maven consumption over local HTTPS
        if: needs.scope.outputs.sharing == 'true'
        run: node scripts/verify-sharing-consumers.mjs --output .verification/sharing-consumers-ci
      - name: Three local project builds
        if: needs.scope.outputs.lessons == 'true'
        run: node scripts/verify-lesson-projects.mjs
      - name: Configure native audio and window manager
        if: needs.scope.outputs.native == 'true' || needs.scope.outputs.lessons == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libasound2-plugins openbox
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=zero_ci
          pactl set-default-sink zero_ci
          cat > "$RUNNER_TEMP/zero-asound.conf" <<'EOF'
          </usr/share/alsa/alsa.conf>
          pcm.!default { type pulse }
          ctl.!default { type pulse }
          EOF
      - name: Game playthrough, canvas and native control input checks
        if: needs.scope.outputs.native == 'true'
        env:
          ALSA_CONFIG_PATH: ${{ runner.temp }}/zero-asound.conf
        run: |
          xvfb-run -a bash <<'EOF'
          openbox --sm-disable > "$RUNNER_TEMP/zero-window-manager.log" 2>&1 &
          npm run dev:smoke
          EOF
      - name: Finite JavaFX example checks
        if: needs.scope.outputs.lessons == 'true'
        env:
          ALSA_CONFIG_PATH: ${{ runner.temp }}/zero-asound.conf
        run: xvfb-run -a python3 scripts/verify-examples.py
      - name: Finite lesson progression checks
        if: needs.scope.outputs.lessons == 'true'
        env:
          ALSA_CONFIG_PATH: ${{ runner.temp }}/zero-asound.conf
        run: xvfb-run -a node scripts/verify-project-progression.mjs
      - name: Website checks
        if: needs.scope.outputs.website == 'true'
        run: |
          npm run typecheck --prefix website
          npm test --prefix website
          npm run build --prefix website
      - name: Package and verify new local version
        if: steps.release.outputs.status == 'local'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          npm run package
          npm run verify:kit
          node scripts/release-review.mjs seal
      - name: Upload exact public assets and review receipts
        if: steps.release.outputs.status == 'local'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-${{ steps.release.outputs.version }}-review-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/${{ steps.release.outputs.kit }}
            dist/${{ steps.release.outputs.starter }}
            dist/${{ steps.release.outputs.extension }}
            dist/release.json
            dist/SHA256SUMS
            dist/SOURCE.txt

  source-gate:
    if: ${{ always() }}
    needs: [scope, review]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require successful source checks
        run: node scripts/ci-gate.mjs
        env:
          ZERO_CI_GATE: '1'
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED: 'true'
          JOB_RESULT: ${{ needs.review.result }}
