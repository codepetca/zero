# Temporary branch-only diagnostic; never merge this workflow.
name: One-off WACK against exact Store 0.5.76 candidate
on:
  workflow_call:
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_RUN: '43927965131'
  CANDIDATE_SOURCE: 'fb5216be670b507185cad241448a2e62ec29bac8'
  CANDIDATE_TREE: 'b00e2736e82c0f42141f4a2c4d1da8bfbe1bcdd6'
  CANDIDATE_SHA256: '20c1c0896f0cc2b75031ca5e09ccf2beea9314b4ce1f480f69487ee23ff53dda'
  PACKAGE_VERSION: '1.5.76.0'
jobs:
  wack:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bind WACK harness source to reviewed release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:GITHUB_REPOSITORY -ne 'codepetca/zero' -or
              $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -ne 'refs/heads/codex/wack-0576-check') {
            throw 'This check is restricted to a manual dispatch on the dedicated Zero branch and a disposable hosted runner.'
          }
          $base = '771fc980f86920e17a01c53e6a0724860d180f93'
          $source = (git rev-parse HEAD).Trim()
          if ($source -ne $env:GITHUB_SHA -or (git rev-parse 'HEAD^').Trim() -ne $base -or
              (git rev-parse "${base}^{tree}").Trim() -ne $env:CANDIDATE_TREE) {
            throw 'Diagnostic checkout must descend directly from the reviewed, tree-equivalent release source.'
          }
          $allowed = @('.github/workflows/windows-native.yml', '.github/workflows/store-wack-one-off.yml')
          $changed = @(git diff --name-only $base $source)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 2 -or @($changed | Where-Object { $_ -notin $allowed }).Count -ne 0) { throw 'Only the two temporary workflows may differ from reviewed source.' }
          git diff --quiet $base $source -- . ':(exclude).github/workflows/windows-native.yml' ':(exclude).github/workflows/store-wack-one-off.yml'
          if ($LASTEXITCODE -ne 0 -or (git status --porcelain)) { throw 'WACK harness source differs from the reviewed release.' }
          node --test scripts/windows-wack-report.test.mjs scripts/windows-editor-window.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WACK and window-proof regression tests must pass.' }
          $output = Join-Path $env:RUNNER_TEMP 'zero-wack-proof'
          New-Item -ItemType Directory -Path $output -ErrorAction Stop | Out-Null
          [ordered]@{
            schema = 1; canonicalSourceRevision = $base; wackHarnessSourceRevision = $source
            harnessSourceEquivalent = $true; differingPaths = $changed
            candidateRunId = $env:CANDIDATE_RUN; candidateRunAttempt = '1'
            candidateArtifactId = '14257711551'
            candidateSourceRevision = $env:CANDIDATE_SOURCE; candidateSourceTree = $env:CANDIDATE_TREE
            candidateSha256 = $env:CANDIDATE_SHA256
            runId = $env:GITHUB_RUN_ID; runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerImage = $env:ImageOS; runnerImageVersion = $env:ImageVersion
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $output 'wack-source-binding.json') -Encoding utf8
      - name: Download exact pull-request Store MSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zero-windows-msix-43927965131-1
          run-id: 43927965131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zero-wack-candidate
      - name: Download prior exact-candidate installation receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zero-windows-msix-installation-43927965131-1
          run-id: 43927965131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zero-wack-prior-install
      - name: Verify exact candidate and source-bound receipts
        id: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'zero-wack-candidate'
          $files = @(Get-ChildItem -LiteralPath $download -Recurse -File -Filter '*.msix')
          $builds = @(Get-ChildItem -LiteralPath $download -Recurse -File -Filter 'build-msix.json')
          $bindings = @(Get-ChildItem -LiteralPath $download -Recurse -File -Filter 'source-and-kit.json')
          $installs = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'zero-wack-prior-install') -Recurse -File -Filter 'install-msix.json')
          if ($files.Count -ne 1 -or $files[0].Name -cne 'Zero-0.5.76-msix-store-x64.msix' -or
              $builds.Count -ne 1 -or $bindings.Count -ne 1 -or $installs.Count -ne 1) {
            throw 'Expected one exact candidate, the two build receipts, and the prior install receipt.'
          }
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $build = Get-Content -LiteralPath $builds[0].FullName -Raw | ConvertFrom-Json
          $binding = Get-Content -LiteralPath $bindings[0].FullName -Raw | ConvertFrom-Json
          $install = Get-Content -LiteralPath $installs[0].FullName -Raw | ConvertFrom-Json
          if ($hash -cne $env:CANDIDATE_SHA256 -or $build.artifact.sha256 -cne $hash -or
              $build.artifact.filename -cne $files[0].Name -or $build.artifact.size -ne $files[0].Length -or
              $build.sourceRevision -cne $env:CANDIDATE_SOURCE -or $build.sourceDirty -ne $false -or
              $build.unsigned -ne $true -or $build.kind -cne 'msix-store' -or $build.kitVersion -cne '0.5.76' -or
              $build.packageVersion -cne $env:PACKAGE_VERSION -or $build.architecture -cne 'x64') {
            throw 'Exact tested candidate or clean-source build receipt mismatch.'
          }
          if ($binding.sourceRevision -cne $env:CANDIDATE_SOURCE -or $binding.githubSha -cne $env:CANDIDATE_SOURCE -or
              $binding.eventName -cne 'pull_request' -or $binding.runId -cne $env:CANDIDATE_RUN -or $binding.runAttempt -cne '1' -or
              $binding.kit.kitVersion -cne $build.kitVersion -or $binding.kit.assets.kit.sha256 -cne $build.kit.sha256 -or
              $install.candidateSha256 -cne $hash -or $install.version -cne $env:PACKAGE_VERSION -or
              $install.result -cne 'passed' -or $install.firstRun.result -cne 'passed' -or
              $install.installVerified -ne $true -or $install.cleanupVerified -ne $true) {
            throw 'Pull-request source binding or prior first-run proof mismatch.'
          }
          $output = Join-Path $env:RUNNER_TEMP 'zero-wack-proof'
          Copy-Item -LiteralPath $builds[0].FullName -Destination (Join-Path $output 'candidate-build-msix.json')
          Copy-Item -LiteralPath $bindings[0].FullName -Destination (Join-Path $output 'candidate-source-and-kit.json')
          Copy-Item -LiteralPath $installs[0].FullName -Destination (Join-Path $output 'candidate-install-msix.json')
          "path=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Initialize exact MSIX and run real Windows App Certification Kit
        shell: powershell
        timeout-minutes: 30
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-msix.ps1 -Package $env:CANDIDATE -PackageVersion $env:PACKAGE_VERSION -Receipt (Join-Path $env:RUNNER_TEMP 'zero-wack-proof/install-wack.json') -RunFirstRun -RequireGit -RunWack
      - name: Retain bounded WACK reports and sanitized receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-store-wack-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/zero-wack-proof/
