name: Zero 0.5.87 Windows release verification
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Canonical manual Windows packaging run ID
        type: string
        required: true
      source_run_attempt:
        description: Canonical Windows packaging run attempt
        type: string
        required: true
      source_artifact_id:
        description: Immutable Windows MSIX artifact ID
        type: string
        required: true
      source_revision:
        description: Full reviewed 0.5.87 packaging source revision
        type: string
        required: true
      package_sha256:
        description: SHA-256 of the original unsigned 0.5.87 Store MSIX
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  classroom-regressions:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          path: candidate-source
          persist-credentials: false
      - name: Verify the exact clean release checkout
        shell: pwsh
        working-directory: candidate-source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64' -or $env:ImageOS -ne 'win22') {
            throw 'Disposable GitHub-hosted windows-2022 x64 runner required.'
          }
          if ($env:SOURCE_REVISION -cnotmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD) -cne $env:SOURCE_REVISION -or (git status --porcelain)) {
            throw 'Checks must use the exact clean release revision.'
          }
          if ((Get-Content -LiteralPath 'release/kit.json' -Raw | ConvertFrom-Json).kitVersion -cne '0.5.87') {
            throw 'Expected Zero 0.5.87 release source.'
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate-source/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        working-directory: candidate-source
        run: npm ci
      - name: Verify the pinned classroom MinGit
        shell: pwsh
        working-directory: candidate-source
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content setup/windows-downloads.json -Raw | ConvertFrom-Json -AsHashtable).architectures.x64.git
          if ($pin.version -ne '2.56.1.windows.1' -or $pin.url -ne 'https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/MinGit-2.56.1-64-bit.zip') { throw 'Unexpected MinGit pin.' }
          $archive = Join-Path $env:RUNNER_TEMP 'zero-classroom-mingit.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'zero-classroom-mingit'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive -TimeoutSec 90
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $pin.sha256) { throw 'MinGit archive bytes differ.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $git = Join-Path $folder 'cmd\git.exe'
          if ((Get-FileHash -LiteralPath $git -Algorithm SHA256).Hash -ne $pin.files['cmd/git.exe']) { throw 'MinGit executable bytes differ.' }
          $version = & $git --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "git version $($pin.version)") { throw 'Unexpected MinGit version.' }
          "ZERO_GIT_EXECUTABLE=$git" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Verified $version"

      - name: Verify real MinGit Merge and Windows command quoting
        shell: pwsh
        working-directory: candidate-source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test --test-name-pattern 'Merge uses a Git-compatible null config|Windows Check sends' extension/test/workflow.test.js extension/test/sharing-local-check.test.js
      - name: Run real Lesson 11 Check Library and both examples
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $proof = node scripts/check-tutorial-library.cjs candidate-source
          $proof
          $proof | Set-Content -LiteralPath "${env:RUNNER_TEMP}/lesson-11.json" -Encoding utf8
      - name: Retain sanitized Lesson 11 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-087-lesson-11-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lesson-11.json
          if-no-files-found: error
          retention-days: 14

  installed-store-payload:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_revision }}
          path: candidate-source
          persist-credentials: false
      - name: Verify the exact clean release checkout
        shell: pwsh
        working-directory: candidate-source
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64' -or $env:ImageOS -ne 'win22') {
            throw 'Disposable GitHub-hosted windows-2022 x64 runner required.'
          }
          if ($env:SOURCE_REVISION -cnotmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD) -cne $env:SOURCE_REVISION -or (git status --porcelain)) {
            throw 'Checks must use the exact clean release revision.'
          }
          if ((Get-Content -LiteralPath 'release/kit.json' -Raw | ConvertFrom-Json).kitVersion -cne '0.5.87') {
            throw 'Expected Zero 0.5.87 release source.'
          }

      - name: Download and verify the reviewed original Store package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_REPOSITORY -ne 'codepetca/zero' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'The Zero diagnostic requires manual dispatch on a disposable x64 GitHub-hosted runner.'
          }
          if ($env:SOURCE_RUN_ID -cnotmatch '^[1-9][0-9]{0,17}$' -or
              $env:SOURCE_RUN_ATTEMPT -cnotmatch '^[1-9][0-9]{0,5}$' -or
              $env:SOURCE_ARTIFACT_ID -cnotmatch '^[1-9][0-9]{0,17}$' -or
              $env:SOURCE_REVISION -cnotmatch '^[a-f0-9]{40}$' -or
              $env:PACKAGE_SHA256 -cnotmatch '^[a-f0-9]{64}$') {
            throw 'Expected numeric IDs and lowercase hexadecimal source and package hashes.'
          }
          $runId = $env:SOURCE_RUN_ID
          $attempt = $env:SOURCE_RUN_ATTEMPT
          $attemptRoute = "repos/codepetca/zero/actions/runs/$runId/attempts/$attempt"
          $run = gh api --method GET $attemptRoute | ConvertFrom-Json
          if ("$($run.id)" -ne $runId -or "$($run.run_attempt)" -ne $attempt -or ($run.status -eq 'completed' -and $run.conclusion -ne 'success') -or
              $run.repository.full_name -ne 'codepetca/zero' -or $run.path -ne '.github/workflows/windows-native.yml' -or
              $run.event -ne 'workflow_dispatch' -or $run.head_branch -cne 'main' -or $run.head_sha -cne $env:SOURCE_REVISION) {
            throw 'Source must be the canonical manual Windows packaging attempt at the reviewed revision.'
          }
          $name = "zero-windows-msix-$runId-$attempt"
          $artifact = gh api --method GET "repos/codepetca/zero/actions/artifacts/$env:SOURCE_ARTIFACT_ID" | ConvertFrom-Json
          if ("$($artifact.id)" -ne $env:SOURCE_ARTIFACT_ID -or $artifact.name -cne $name -or $artifact.expired -ne $false -or
              "$($artifact.workflow_run.id)" -ne $runId -or $artifact.workflow_run.head_sha -cne $env:SOURCE_REVISION) {
            throw 'The identified artifact does not belong to the selected Windows packaging attempt.'
          }
          $output = '.verification/store-package-proof'
          if (Test-Path -LiteralPath $output) { throw 'Diagnostic output must be new.' }
          gh run download $runId --repo codepetca/zero --name $name --dir $output
          $current = gh api --method GET "repos/codepetca/zero/actions/runs/$runId/artifacts" -f "name=$name" | ConvertFrom-Json
          if ($current.total_count -ne 1 -or "$($current.artifacts[0].id)" -ne $env:SOURCE_ARTIFACT_ID) {
            throw 'The downloaded artifact name no longer refers to the selected immutable artifact.'
          }
          $filename = 'Zero-0.5.87-msix-store-x64.msix'
          if (Compare-Object @($filename, 'build-msix.json', 'source-and-kit.json') @(Get-ChildItem -LiteralPath $output -Force -Name)) {
            throw 'Expected only the original package and its two build receipts.'
          }
          $file = Join-Path $output $filename
          $build = Get-Content -LiteralPath (Join-Path $output 'build-msix.json') -Raw | ConvertFrom-Json
          $source = Get-Content -LiteralPath (Join-Path $output 'source-and-kit.json') -Raw | ConvertFrom-Json
          if ($build.schema -ne 1 -or $build.kind -ne 'msix-store' -or $build.kitVersion -ne '0.5.87' -or
              $build.packageVersion -ne '1.5.87.0' -or $build.architecture -ne 'x64' -or $build.unsigned -ne $true -or
              $build.sourceDirty -ne $false -or $build.sourceRevision -cne $env:SOURCE_REVISION -or
              $build.artifact.filename -cne $filename -or $build.artifact.sha256 -cne $env:PACKAGE_SHA256 -or
              $build.artifact.size -ne (Get-Item -LiteralPath $file).Length -or
              (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:PACKAGE_SHA256) {
            throw 'Original 0.5.87 Store package does not match the reviewed source, size and hash.'
          }
          if ($source.schema -ne 1 -or $source.sourceRevision -cne $env:SOURCE_REVISION -or $source.githubSha -cne $env:SOURCE_REVISION -or
              $source.eventName -ne 'workflow_dispatch' -or "$($source.runId)" -ne $runId -or "$($source.runAttempt)" -ne $attempt -or
              $source.kit.kitVersion -ne '0.5.87' -or $build.kit.sha256 -cnotmatch '^[a-f0-9]{64}$' -or
              $source.kit.assets.kit.sha256 -cne $build.kit.sha256 -or $source.kit.assets.kit.size -ne $build.kit.size -or
              $build.packager.kind -cne 'makeappx' -or $build.packager.roundTripPassed -ne $true -or
              $source.packager.signatureStatus -cne 'Valid' -or $source.packager.sha256 -cne $build.packager.sha256) {
            throw 'Source-and-kit receipt does not match the packaging attempt and embedded kit.'
          }
          [ordered]@{
            schema = 1; sourceRunId = $runId; sourceRunAttempt = $attempt; sourceArtifactId = $env:SOURCE_ARTIFACT_ID
            sourceRevision = $env:SOURCE_REVISION; packageVersion = $build.packageVersion
            packageSha256 = $env:PACKAGE_SHA256; kitSha256 = $build.kit.sha256
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'candidate-proof.json') -Encoding utf8

      - name: Install the test-signed copy and verify exact payload and cleanup
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = '.verification/store-package-proof'
          $candidate = Get-Content -LiteralPath (Join-Path $output 'candidate-proof.json') -Raw | ConvertFrom-Json
          $file = Join-Path $output 'Zero-0.5.87-msix-store-x64.msix'
          $receipt = Join-Path $output 'install-msix.json'
          & ./candidate-source/scripts/test-windows-msix.ps1 -Package $file -PackageVersion $candidate.packageVersion -Receipt $receipt
          $install = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if ($install.result -ne 'passed' -or -not $install.installVerified -or -not $install.cleanupVerified -or
              $install.candidateSha256 -cne $candidate.packageSha256 -or
              $install.candidateExecutableSha256 -cne $install.installedExecutableSha256 -or
              (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $candidate.packageSha256) {
            throw 'Signed-copy deployment and cleanup must match the exact unchanged original.'
          }
          exit 0
      - name: Retain source and installed payload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-087-store-package-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .verification/store-package-proof/candidate-proof.json
            .verification/store-package-proof/install-msix.json
