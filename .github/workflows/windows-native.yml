name: Public Zero Studio installation proof
on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Zero kit version to verify
        required: true
        type: choice
        options:
          - 0.5.87
          - 0.5.89
permissions:
  contents: read
  actions: read
jobs:
  store:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the public Store package on a clean runner
        shell: pwsh
        env:
          ZERO_PROOF_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'Codepet.zerostudio'
          $family = 'Codepet.zerostudio_g62pw1js6rhjp'
          $version = $env:ZERO_PROOF_VERSION
          if ($version -notin '0.5.87','0.5.89' -or (Get-AppxPackage -Name $app)) { throw 'Invalid version or previously installed application.' }
          $winget = (Get-Command winget.exe -ErrorAction Stop).Source
          & $winget install --id 9MXKD6DQLFGX --exact --source msstore --silent --disable-interactivity --authentication-mode silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "Public Store installation failed with exit $LASTEXITCODE." }
          $package = Get-AppxPackage -Name $app
          $packageVersion = '1' + $version.Substring(1) + '.0'
          $expectedName = "${app}_${packageVersion}_x64__g62pw1js6rhjp"
          if ($package.PackageFullName -ne $expectedName -or $package.SignatureKind -ne 'Store' -or $package.Status -ne 'Ok') { throw 'Expected the exact Microsoft Store-signed Zero Studio release.' }
          [pscustomobject]@{
            fullName = $package.PackageFullName
            signatureKind = $package.SignatureKind.ToString()
            status = $package.Status.ToString()
            acquiredFrom = 'winget msstore'
          } | ConvertTo-Json | Tee-Object -FilePath "${env:RUNNER_TEMP}/public-store-proof.json"
          & .\scripts\test-msix-first-run.ps1 -PackageFamily $family -KitVersion $version -RequireGit
      - name: Prepare the installed-editor test driver
        if: inputs.version == '0.5.89'
        run: npm ci
      - name: Run the exact production Lesson 11 in the installed Store editor
        if: inputs.version == '0.5.89'
        shell: pwsh
        run: .\scripts\test-public-store-collision.ps1 -OutputDirectory "${env:RUNNER_TEMP}/zero-collision-exercise"
      - name: Retain the public installer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-store-install-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-store-proof.json
            ${{ runner.temp }}/zero-collision-exercise/collision-result.json
            ${{ runner.temp }}/zero-collision-exercise/store-jdk-collision.json
            ${{ runner.temp }}/zero-collision-exercise/public-editor-add.png
            ${{ runner.temp }}/zero-collision-exercise/public-editor-command.png
            ${{ runner.temp }}/zero-collision-exercise/public-browser-preview.png
          if-no-files-found: ignore
          retention-days: 7
