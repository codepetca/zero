name: Windows launcher checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
  windows-tests:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Inspect Windows certification environment
        shell: powershell
        run: |
          $tool = 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe'
          [ordered]@{
            appcertAvailable = (Test-Path -LiteralPath $tool -PathType Leaf)
            sessionId = (Get-Process -Id $PID).SessionId
            userInteractive = [Environment]::UserInteractive
          } | ConvertTo-Json
      - name: Restore pinned build tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          dotnet tool restore
      - name: Select Java 21 for extracted kit compilation
        shell: powershell
        run: |
          if (-not $env:JAVA_HOME_21_X64) { throw 'The hosted runner must provide Java 21.' }
          $javaBin = Join-Path $env:JAVA_HOME_21_X64 'bin'
          $javac = Join-Path $javaBin 'javac.exe'
          if (-not (Test-Path -LiteralPath $javac -PathType Leaf)) { throw 'Java 21 compiler is missing.' }
          $version = & $javac -version 2>&1
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^javac 21\.') { throw 'Expected Java 21 compiler.' }
          "JAVA_HOME=$env:JAVA_HOME_21_X64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $javaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            student-template/.mvn/wrapper/maven-wrapper.properties
            extension/src/web-export/toolchain-lock.json
      - name: Native fixtures and update authentication
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:windows
          npm run test:updates:windows
          node --test extension/test/native-updates.test.js
          node --test extension/test/managed-java.test.js
          node --test extension/test/process-specification.test.js
          node --test scripts/test-windows-javafx.test.mjs
          node --test scripts/windows-wack-report.test.mjs
          node --test setup/tests/windows-checkout.test.mjs
      - name: Build measured development installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run package
          npm run verify:kit
          node scripts/build-installers.mjs --platform windows
          node scripts/verify-installers.mjs --platform windows
      - name: Build source-bound Store MSIX with the Windows SDK
        id: store-msix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable GitHub-hosted runner required.' }
          $packager = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe'
          if (-not (Test-Path -LiteralPath $packager -PathType Leaf)) { throw 'Windows SDK 10.0.26100.0 x64 MakeAppx.exe is required.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $packager
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') {
            throw 'MakeAppx.exe must have a valid Microsoft Authenticode signature.'
          }
          $versionInfo = (Get-Item -LiteralPath $packager).VersionInfo
          if ($versionInfo.FileMajorPart -ne 10 -or $versionInfo.FileMinorPart -ne 0 -or $versionInfo.FileBuildPart -ne 26100) {
            throw 'MakeAppx.exe file version must match Windows SDK 10.0.26100.'
          }
          $packagerEvidence = [ordered]@{
            path = $packager
            fileVersion = $versionInfo.FileVersion
            sha256 = (Get-FileHash -LiteralPath $packager -Algorithm SHA256).Hash.ToLowerInvariant()
            signatureStatus = $signature.Status.ToString()
            signerSubject = $signature.SignerCertificate.Subject
            signerThumbprint = $signature.SignerCertificate.Thumbprint
          }
          $sourceRevision = (git rev-parse HEAD).Trim()
          if ($sourceRevision -ne $env:GITHUB_SHA) { throw 'MSIX source must match the workflow checkout SHA.' }
          if (git status --porcelain) { throw 'MSIX source must be clean before packaging.' }
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist/msix'
          if (Test-Path -LiteralPath $output) { throw 'MSIX candidate output must be new and empty.' }
          npm run test:msix
          npm run package:windows:msix -- --packager "$packager" --kind makeappx --channel store --output "$output"
          $kit = Get-Content -LiteralPath 'dist/release.json' -Raw | ConvertFrom-Json
          $receipt = Get-Content -LiteralPath (Join-Path $output 'build-msix.json') -Raw | ConvertFrom-Json
          if ($receipt.sourceRevision -ne $sourceRevision -or $receipt.sourceDirty -ne $false -or $receipt.kind -ne 'msix-store' -or $receipt.kitVersion -ne $kit.kitVersion -or $receipt.kit.sha256 -ne $kit.assets.kit.sha256 -or $receipt.packager.sha256 -ne $packagerEvidence.sha256) {
            throw 'Store MSIX receipt must match the clean source and verified kit.'
          }
          $artifact = Join-Path $output ("Zero-{0}-msix-store-x64.msix" -f $kit.kitVersion)
          if ($receipt.artifact.filename -ne (Split-Path $artifact -Leaf) -or (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne $receipt.artifact.sha256) {
            throw 'Store MSIX artifact must match its measured receipt.'
          }
          [ordered]@{
            schema = 1
            sourceRevision = $sourceRevision
            githubSha = $env:GITHUB_SHA
            eventName = $env:GITHUB_EVENT_NAME
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            packager = $packagerEvidence
            kit = $kit
          } | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $output 'source-and-kit.json') -Encoding utf8
          "filename=$($receipt.artifact.filename)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Retain measured Store MSIX candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-windows-msix-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/msix/${{ steps.store-msix.outputs.filename }}
            dist/msix/build-msix.json
            dist/msix/source-and-kit.json
      - name: Real install, private runtime bootstrap and editor reopening
        # This is a disposable GitHub-hosted account. Never target a self-hosted
        # runner or pass credentials. GUI/network failures remain failing evidence.
        shell: powershell
        timeout-minutes: 22
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable GitHub-hosted runner required.' }
          & ./scripts/test-windows-installation.ps1 -DisposableAccount
      - name: Real private-Java JavaFX window and cached offline rebuild
        # Node is maintainer/CI tooling only. No student Node/global Maven install.
        timeout-minutes: 12
        run: node scripts/test-windows-javafx.mjs --disposable-account
      - name: Install and validate a separately test-signed MSIX copy with WACK
        shell: powershell
        timeout-minutes: 25
        run: |
          $receipt = Get-Content -LiteralPath 'dist/msix/build-msix.json' -Raw | ConvertFrom-Json
          & ./scripts/test-windows-msix.ps1 -Package (Join-Path 'dist/msix' $receipt.artifact.filename) -PackageVersion $receipt.packageVersion -Receipt 'dist/msix/install-msix.json' -RunWack
      - name: Retain sanitized MSIX deployment result
        if: always() && steps.store-msix.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-windows-msix-installation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/msix/install-msix.json
            dist/msix/wack/report.xml
            dist/msix/wack/report.html
      - name: Retain Windows JavaFX receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-windows-javafx-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          # Raw Maven logs contain account paths and remain on the disposable
          # runner; never upload whole project/cache/editor state.
          path: .verification/windows-javafx/report.json
      - name: Retain Windows installation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-windows-installation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .verification/windows-installation/report.json
            .verification/windows-installation/setup.log
      - name: Retain measured development candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-windows-development-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/installers/Zero-Setup-*-windows-development.exe
            dist/installers/Zero-*-full.nupkg
            dist/installers/build-windows.json

  windows:
    if: ${{ always() }}
    needs: [scope, windows-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require selected windows checks
        run: node scripts/ci-gate.mjs
        env:
          ZERO_CI_GATE: '1'
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED: ${{ needs.scope.outputs.windows || 'true' }}
          JOB_RESULT: ${{ needs.windows-tests.result }}
