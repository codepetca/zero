name: Zero 0.5.85 Store browser diagnostic
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful manual Windows packaging run ID
        type: string
        required: true
      source_run_attempt:
        description: Successful Windows packaging run attempt
        type: string
        required: true
      source_artifact_id:
        description: Immutable Windows MSIX artifact ID
        type: string
        required: true
      source_revision:
        description: Full reviewed 0.5.85 packaging source revision
        type: string
        required: true
      package_sha256:
        description: SHA-256 of the original unsigned 0.5.85 Store MSIX
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  store-browser-build:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download and verify the reviewed original Store package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_REPOSITORY -ne 'codepetca/zero' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or
              $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'The Zero diagnostic requires manual dispatch on a disposable x64 GitHub-hosted runner.'
          }
          if ($env:SOURCE_RUN_ID -cnotmatch '^[1-9][0-9]{0,17}$' -or
              $env:SOURCE_RUN_ATTEMPT -cnotmatch '^[1-9][0-9]{0,5}$' -or
              $env:SOURCE_ARTIFACT_ID -cnotmatch '^[1-9][0-9]{0,17}$' -or
              $env:SOURCE_REVISION -cnotmatch '^[a-f0-9]{40}$' -or
              $env:PACKAGE_SHA256 -cnotmatch '^[a-f0-9]{64}$') {
            throw 'Expected numeric IDs and lowercase hexadecimal source and package hashes.'
          }
          $runId = $env:SOURCE_RUN_ID
          $attempt = $env:SOURCE_RUN_ATTEMPT
          $attemptRoute = "repos/codepetca/zero/actions/runs/$runId/attempts/$attempt"
          $run = gh api --method GET $attemptRoute | ConvertFrom-Json
          if ("$($run.id)" -ne $runId -or "$($run.run_attempt)" -ne $attempt -or $run.conclusion -ne 'success' -or
              $run.repository.full_name -ne 'codepetca/zero' -or $run.path -ne '.github/workflows/windows-native.yml' -or
              $run.event -ne 'workflow_dispatch' -or $run.head_sha -cne $env:SOURCE_REVISION) {
            throw 'Source must be the successful manual Windows packaging attempt at the reviewed revision.'
          }
          $name = "zero-windows-msix-$runId-$attempt"
          $artifact = gh api --method GET "repos/codepetca/zero/actions/artifacts/$env:SOURCE_ARTIFACT_ID" | ConvertFrom-Json
          if ("$($artifact.id)" -ne $env:SOURCE_ARTIFACT_ID -or $artifact.name -cne $name -or $artifact.expired -ne $false -or
              "$($artifact.workflow_run.id)" -ne $runId -or $artifact.workflow_run.head_sha -cne $env:SOURCE_REVISION) {
            throw 'The identified artifact does not belong to the selected Windows packaging attempt.'
          }
          $output = '.verification/store-browser-proof'
          if (Test-Path -LiteralPath $output) { throw 'Diagnostic output must be new.' }
          gh run download $runId --repo codepetca/zero --name $name --dir $output
          $current = gh api --method GET "repos/codepetca/zero/actions/runs/$runId/artifacts" -f "name=$name" | ConvertFrom-Json
          if ($current.total_count -ne 1 -or "$($current.artifacts[0].id)" -ne $env:SOURCE_ARTIFACT_ID) {
            throw 'The downloaded artifact name no longer refers to the selected immutable artifact.'
          }
          $filename = 'Zero-0.5.85-msix-store-x64.msix'
          if (Compare-Object @($filename, 'build-msix.json', 'source-and-kit.json') @(Get-ChildItem -LiteralPath $output -Force -Name)) {
            throw 'Expected only the original package and its two build receipts.'
          }
          $file = Join-Path $output $filename
          $build = Get-Content -LiteralPath (Join-Path $output 'build-msix.json') -Raw | ConvertFrom-Json
          $source = Get-Content -LiteralPath (Join-Path $output 'source-and-kit.json') -Raw | ConvertFrom-Json
          if ($build.schema -ne 1 -or $build.kind -ne 'msix-store' -or $build.kitVersion -ne '0.5.85' -or
              $build.packageVersion -ne '1.5.85.0' -or $build.architecture -ne 'x64' -or $build.unsigned -ne $true -or
              $build.sourceDirty -ne $false -or $build.sourceRevision -cne $env:SOURCE_REVISION -or
              $build.artifact.filename -cne $filename -or $build.artifact.sha256 -cne $env:PACKAGE_SHA256 -or
              $build.artifact.size -ne (Get-Item -LiteralPath $file).Length -or
              (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:PACKAGE_SHA256) {
            throw 'Original 0.5.85 Store package does not match the reviewed source, size and hash.'
          }
          if ($source.schema -ne 1 -or $source.sourceRevision -cne $env:SOURCE_REVISION -or $source.githubSha -cne $env:SOURCE_REVISION -or
              $source.eventName -ne 'workflow_dispatch' -or "$($source.runId)" -ne $runId -or "$($source.runAttempt)" -ne $attempt -or
              $source.kit.kitVersion -ne '0.5.85' -or $build.kit.sha256 -cnotmatch '^[a-f0-9]{64}$' -or
              $source.kit.assets.kit.sha256 -cne $build.kit.sha256) {
            throw 'Source-and-kit receipt does not match the packaging attempt and embedded kit.'
          }
          [ordered]@{
            schema = 1; sourceRunId = $runId; sourceRunAttempt = $attempt; sourceArtifactId = $env:SOURCE_ARTIFACT_ID
            sourceRevision = $env:SOURCE_REVISION; packageVersion = $build.packageVersion
            packageSha256 = $env:PACKAGE_SHA256; kitSha256 = $build.kit.sha256
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'candidate-proof.json') -Encoding utf8

      - name: Open the exact test-signed package, repair saved tooling and build cold
        shell: powershell
        timeout-minutes: 16
        run: |
          $ErrorActionPreference = 'Stop'
          $output = '.verification/store-browser-proof'
          $candidate = Get-Content -LiteralPath (Join-Path $output 'candidate-proof.json') -Raw | ConvertFrom-Json
          $env:ZERO_STORE_DIAGNOSTIC_KIT_SHA256 = $candidate.kitSha256
          $env:ZERO_STORE_DIAGNOSTIC_RECEIPT = Join-Path (Resolve-Path -LiteralPath $output).ProviderPath 'browser-proof.json'
          $result = Join-Path $output 'install-msix.json'
          & ./scripts/test-windows-msix.ps1 -Package (Join-Path $output 'Zero-0.5.85-msix-store-x64.msix') -PackageVersion '1.5.85.0' -Receipt $result -RunFirstRun -RequireGit
          $install = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if ($install.result -ne 'passed' -or -not $install.installVerified -or -not $install.cleanupVerified -or
              $install.firstRun.result -ne 'passed' -or $install.candidateSha256 -cne $candidate.packageSha256) {
            throw 'Verified setup and cleanup must match the original 0.5.85 Store package.'
          }

      - name: Retain the sanitized source, install and browser receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zero-085-store-browser-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .verification/store-browser-proof/candidate-proof.json
            .verification/store-browser-proof/install-msix.json
            .verification/store-browser-proof/browser-proof.json
