name: Public Zero Studio installation proof
on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Zero kit version to verify
        required: true
        type: choice
        options:
          - 0.5.91
permissions:
  contents: read
  actions: read
jobs:
  store:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the public Store package on a clean runner
        shell: pwsh
        env:
          ZERO_PROOF_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable GitHub-hosted runner required.' }
          $app = 'Codepet.zerostudio'
          $family = 'Codepet.zerostudio_g62pw1js6rhjp'
          $version = $env:ZERO_PROOF_VERSION
          if ($version -ne '0.5.91' -or (Get-AppxPackage -Name $app)) { throw 'Invalid version or previously installed application.' }
          $winget = (Get-Command winget.exe -ErrorAction Stop).Source
          & $winget install --id 9MXKD6DQLFGX --exact --source msstore --silent --disable-interactivity --authentication-mode silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "Public Store installation failed with exit $LASTEXITCODE." }
          $package = Get-AppxPackage -Name $app
          $packageVersion = '1.5.91.0'
          $expectedName = "${app}_${packageVersion}_x64__g62pw1js6rhjp"
          if ($package.PackageFullName -ne $expectedName -or $package.PackageFamilyName -ne $family -or $package.SignatureKind -ne 'Store' -or $package.Status -ne 'Ok') { throw 'Expected the exact Microsoft Store-signed Zero Studio release.' }
          [pscustomobject]@{
            fullName = $package.PackageFullName
            signatureKind = $package.SignatureKind.ToString()
            status = $package.Status.ToString()
            acquiredFrom = 'winget msstore'
            expectedVersion = $packageVersion
            runId = $env:GITHUB_RUN_ID
          } | ConvertTo-Json | Tee-Object -FilePath "${env:RUNNER_TEMP}/public-store-proof.json"
      - name: Verify public Store first-run setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = [ordered]@{ schema = 1; kitVersion = '0.5.91'; packageVersion = '1.5.91.0'; firstRun = 'failed'; requireGit = $true; runId = $env:GITHUB_RUN_ID }
          try {
            & .\scripts\test-msix-first-run.ps1 -PackageFamily 'Codepet.zerostudio_g62pw1js6rhjp' -KitVersion '0.5.91' -RequireGit
            $result.firstRun = 'passed'
          } finally {
            $result | ConvertTo-Json | Set-Content -LiteralPath "${env:RUNNER_TEMP}/public-store-first-run.json"
          }
      - name: Retain the public installer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-store-install-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-store-proof.json
            ${{ runner.temp }}/public-store-first-run.json
            ${{ runner.temp }}/zero-msix-consent-diagnostic.png
          if-no-files-found: warn
          retention-days: 14
