name: Windows classroom regression verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-classroom-regressions:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the pinned classroom MinGit
        id: mingit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content setup/windows-downloads.json -Raw | ConvertFrom-Json -AsHashtable).architectures.x64.git
          if ($pin.version -ne '2.56.1.windows.1' -or $pin.url -ne 'https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/MinGit-2.56.1-64-bit.zip') { throw 'Unexpected MinGit pin.' }
          $archive = Join-Path $env:RUNNER_TEMP 'zero-classroom-mingit.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'zero-classroom-mingit'
          Invoke-WebRequest -Uri $pin.url -OutFile $archive -TimeoutSec 90
          if ((Get-Item -LiteralPath $archive).Length -ne $pin.size -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $pin.sha256) { throw 'MinGit archive bytes differ.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $git = Join-Path $folder 'cmd\git.exe'
          if ((Get-FileHash -LiteralPath $git -Algorithm SHA256).Hash -ne $pin.files['cmd/git.exe']) { throw 'MinGit executable bytes differ.' }
          $version = & $git --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "git version $($pin.version)") { throw 'Unexpected MinGit version.' }
          "ZERO_GIT_EXECUTABLE=$git" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Verified $version"
      - name: Observe Merge and Check Library on the 0.5.86 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = (Get-Location).Path
          $baseline = Join-Path $env:RUNNER_TEMP 'zero-classroom-released-baseline'
          git worktree add --detach "$baseline" a13e9999dc70aae125c18fd9dd62186a4a2277d2
          if ($LASTEXITCODE -ne 0) { throw 'Could not open the released source in a disposable worktree.' }
          $env:NODE_PATH = Join-Path $root 'node_modules'
          foreach ($file in @('extension/test/workflow.test.js', 'extension/test/sharing-local-check.test.js', 'scripts/check-tutorial-library.cjs')) {
            Copy-Item -LiteralPath (Join-Path $root $file) -Destination (Join-Path $baseline $file)
          }
          function Observe-Baseline($name, $arguments, $expected) {
            $log = & node @arguments 2>&1 | Out-String -Width 240
            $code = $LASTEXITCODE
            $log
            if ($code -eq 0) { "Baseline $name passed." }
            elseif ($log -match $expected) { "Baseline $name reproduced the reported failure path (exit $code)." }
            else { "Baseline $name failed with a different diagnostic (exit $code)." }
          }
          Observe-Baseline 'Merge' @('--test', '--test-name-pattern', 'Merge uses a Git-compatible null config', (Join-Path $baseline 'extension/test/workflow.test.js')) 'Git rev-parse failed \(exit 128\)'
          Observe-Baseline 'Check Library command' @('--test', '--test-name-pattern', 'Windows Check sends', (Join-Path $baseline 'extension/test/sharing-local-check.test.js')) 'Local Check command failed \(1\)'
          Observe-Baseline 'Lesson 11 badge' @((Join-Path $baseline 'scripts/check-tutorial-library.cjs')) 'Local Check command failed \(1\)'
          exit 0
      - name: Verify both fixes on Windows
        if: ${{ !cancelled() && steps.mingit.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test --test-name-pattern 'Merge uses a Git-compatible null config|Windows Check sends' extension/test/workflow.test.js extension/test/sharing-local-check.test.js
      - name: Verify the fixed Lesson 11 check and both examples
        if: ${{ !cancelled() && steps.mingit.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check-tutorial-library.cjs
