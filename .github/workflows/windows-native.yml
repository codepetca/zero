name: Public Zero Studio installation proof
on:
  workflow_dispatch:
    inputs:
      version:
        description: Public Zero kit version to verify
        required: true
        type: choice
        options:
          - 0.5.87
          - 0.5.89
      mode:
        description: Exercise the installed editor or preflight the sign-in handoff
        default: exercise
        type: choice
        options:
          - exercise
          - prepare
          - desktop
          - relay
      recipient:
        description: One-run desktop public key
        type: string
      parent:
        description: Parent desktop test run ID
        type: string
      packet:
        description: Encrypted tunnel configuration
        type: string
permissions:
  contents: read
  actions: read
jobs:
  relay:
    if: inputs.mode == 'relay' && github.actor == 'armorup'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Stage encrypted configuration for the original run
        env:
          ZERO_DESKTOP_PARENT: ${{ inputs.parent }}
          ZERO_DESKTOP_PACKET: ${{ inputs.packet }}
        run: node scripts/proof-desktop-channel.mjs reply "$RUNNER_TEMP/zero-desktop-reply"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-qa-desktop-reply-${{ inputs.parent }}
          path: ${{ runner.temp }}/zero-desktop-reply/envelope.json
          if-no-files-found: error
          retention-days: 1
  store:
    if: inputs.mode != 'relay' && (inputs.mode != 'desktop' || github.actor == 'armorup')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the public Store package on a clean runner
        shell: pwsh
        env:
          ZERO_PROOF_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'Codepet.zerostudio'
          $family = 'Codepet.zerostudio_g62pw1js6rhjp'
          $version = $env:ZERO_PROOF_VERSION
          if ($version -notin '0.5.87','0.5.89' -or (Get-AppxPackage -Name $app)) { throw 'Invalid version or previously installed application.' }
          $winget = (Get-Command winget.exe -ErrorAction Stop).Source
          & $winget install --id 9MXKD6DQLFGX --exact --source msstore --silent --disable-interactivity --authentication-mode silent --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { throw "Public Store installation failed with exit $LASTEXITCODE." }
          $package = Get-AppxPackage -Name $app
          $packageVersion = '1' + $version.Substring(1) + '.0'
          $expectedName = "${app}_${packageVersion}_x64__g62pw1js6rhjp"
          if ($package.PackageFullName -ne $expectedName -or $package.SignatureKind -ne 'Store' -or $package.Status -ne 'Ok') { throw 'Expected the exact Microsoft Store-signed Zero Studio release.' }
          [pscustomobject]@{
            fullName = $package.PackageFullName
            signatureKind = $package.SignatureKind.ToString()
            status = $package.Status.ToString()
            acquiredFrom = 'winget msstore'
          } | ConvertTo-Json | Tee-Object -FilePath "${env:RUNNER_TEMP}/public-store-proof.json"
          & .\scripts\test-msix-first-run.ps1 -PackageFamily $family -KitVersion $version -RequireGit
      - name: Prepare the installed-editor test driver
        if: inputs.version == '0.5.89'
        run: npm ci
      - name: Run the exact production Lesson 11 in the installed Store editor
        if: inputs.version == '0.5.89'
        shell: pwsh
        env:
          ZERO_PROOF_TEST_MODE: ${{ inputs.mode }}
        run: |
          $phase = if ($env:ZERO_PROOF_TEST_MODE -in 'prepare','desktop') { 'Prepare' } else { 'All' }
          & .\scripts\test-public-store-collision.ps1 -Phase $phase -OutputDirectory "${env:RUNNER_TEMP}/zero-collision-exercise"
      - name: Configure the private desktop on the disposable runner
        if: inputs.mode == 'desktop'
        shell: pwsh
        env:
          ZERO_DESKTOP_RECIPIENT: ${{ inputs.recipient }}
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'zero-private-desktop'
          & .\scripts\prepare-proof-desktop.ps1 -Directory $work
          node scripts/proof-desktop-channel.mjs begin $work
      - name: Share encrypted desktop metadata
        if: inputs.mode == 'desktop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-qa-desktop-${{ github.run_id }}
          path: ${{ runner.temp }}/zero-private-desktop/envelope.json
          if-no-files-found: error
          retention-days: 1
      - name: Host the private tunnel with its one-tunnel host token
        if: inputs.mode == 'desktop'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/proof-desktop-channel.mjs host "${env:RUNNER_TEMP}/zero-private-desktop"
      - name: Resume the editor exercise after the owner signs in
        if: inputs.mode == 'desktop'
        shell: pwsh
        run: .\scripts\test-public-store-collision.ps1 -Phase Finish -OutputDirectory "${env:RUNNER_TEMP}/zero-collision-exercise"
      - name: Close the temporary tunnel host
        if: always() && inputs.mode == 'desktop'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'zero-private-desktop'
          $record = Join-Path $work 'host-process.json'
          if (Test-Path -LiteralPath $record) {
            $process = Get-Content -LiteralPath $record -Raw | ConvertFrom-Json
            Stop-Process -Id $process.pid -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
      - name: Retain the public installer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-store-install-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-store-proof.json
            ${{ runner.temp }}/zero-collision-exercise/collision-result.json
            ${{ runner.temp }}/zero-collision-exercise/store-jdk-collision.json
            ${{ runner.temp }}/zero-collision-exercise/public-editor-add.png
            ${{ runner.temp }}/zero-collision-exercise/public-editor-command.png
            ${{ runner.temp }}/zero-collision-exercise/public-browser-preview.png
          if-no-files-found: ignore
          retention-days: 7
