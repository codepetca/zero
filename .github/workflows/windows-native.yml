name: Windows jam link QA
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jam-link:
    if: github.ref == 'refs/heads/codex/zero-jam-windows-qa'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install package and preview dependencies
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix website ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node -e "require('playwright')"
      - name: Build the candidate from the QA commit
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Use a disposable Windows runner.' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA -or (git status --porcelain)) { throw 'Source must match the QA commit.' }
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          if (-not $env:JAVA_HOME) { throw 'Java 21 is unavailable.' }
          $env:Path = "$env:JAVA_HOME\bin;$env:Path"
          npm run package
          npm run verify:kit
          $packager = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\makeappx.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $packager
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)O=Microsoft Corporation(?:,|$)') { throw 'Expected the signed Microsoft MakeAppx tool.' }
          npm run package:windows:msix -- --packager "$packager" --kind makeappx --channel store
          $measured = Get-Content -LiteralPath dist/msix/build-msix.json -Raw | ConvertFrom-Json
          if ($measured.sourceRevision -ne $env:GITHUB_SHA -or $measured.sourceDirty -or $measured.kind -ne 'msix-store') { throw 'Candidate receipt did not match the checked-out QA commit.' }
      - name: Install, click Open in Zero, and verify the exact jam
        shell: powershell
        timeout-minutes: 16
        run: |
          $ErrorActionPreference = 'Stop'
          $out = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/jam-link-qa"
          $fixture = Join-Path $out.FullName 'fixture.json'
          $preview = Start-Process node -ArgumentList @('scripts/serve-windows-jam-link.mjs',('"' + $fixture + '"')) -PassThru -RedirectStandardOutput (Join-Path $out.FullName 'preview.log') -RedirectStandardError (Join-Path $out.FullName 'preview-errors.log')
          try {
            $deadline = [DateTime]::UtcNow.AddMinutes(2)
            while (-not (Test-Path -LiteralPath $fixture)) {
              if ($preview.HasExited -or [DateTime]::UtcNow -ge $deadline) {
                Get-Content (Join-Path $out.FullName 'preview-errors.log') -ErrorAction SilentlyContinue
                throw 'The loopback jam preview failed to start.'
              }
              Start-Sleep -Seconds 1
              $preview.Refresh()
            }
            $measured = Get-Content -LiteralPath dist/msix/build-msix.json -Raw | ConvertFrom-Json
            & ./scripts/test-windows-msix.ps1 -Package (Join-Path 'dist/msix' $measured.artifact.filename) -PackageVersion $measured.packageVersion -Receipt (Join-Path $out.FullName 'install.json') -RunFirstRun -RequireGit -Windows2025Diagnostic -JamFixture $fixture
          } finally {
            if (-not $preview.HasExited) { Stop-Process -Id $preview.Id -Force }
          }
      - name: Keep the test receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-windows-jam-link-qa
          path: |
            dist/msix/build-msix.json
            ${{ runner.temp }}/jam-link-qa/install.json
            ${{ runner.temp }}/jam-link-qa/jam-link.json
          if-no-files-found: warn
          retention-days: 3
