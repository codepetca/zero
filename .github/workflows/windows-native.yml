name: Public Windows release environment check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Inspect public upload routing and Store installer support
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = curl.exe --disable --head --silent --show-error --output NUL --connect-timeout 10 --max-time 15 --write-out 'HTTP=%{http_code} TLS=%{time_appconnect}' https://upload.xboxlive.com/
          Write-Host "Official upload endpoint: $head (curl exit $LASTEXITCODE)"
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          $appInstaller = Get-AppxPackage -Name Microsoft.DesktopAppInstaller -ErrorAction SilentlyContinue
          $store = Get-AppxPackage -Name Microsoft.WindowsStore -ErrorAction SilentlyContinue
          $licenseService = Get-Service -Name ClipSVC -ErrorAction SilentlyContinue
          [pscustomobject]@{
            winget = [bool]$winget
            appInstaller = [bool]$appInstaller
            store = [bool]$store
            licenseService = [bool]$licenseService
          } | ConvertTo-Json
