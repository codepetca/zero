name: Windows launcher checks
on:
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Canonical 0.5.91 release preparation run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  portable-exact:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download exact prepared Complete ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_RUN: ${{ inputs.preparation_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PREPARATION_RUN -notmatch '^[0-9]+$') { throw 'Invalid run ID.' }
          $deadline = (Get-Date).AddMinutes(20)
          do {
            $run = gh api "repos/codepetca/zero/actions/runs/$env:PREPARATION_RUN" | ConvertFrom-Json
            if ($run.status -eq 'completed') { break }
            Start-Sleep -Seconds 20
          } while ((Get-Date) -lt $deadline)
          if ($run.path -ne '.github/workflows/release-review.yml' -or $run.event -ne 'workflow_dispatch' -or $run.conclusion -ne 'success' -or $run.head_sha -ne '3aff108a83acec8e664dde7f4eaff53db62a064c') { throw "Unexpected preparation run $($run.head_sha), $($run.name), $($run.conclusion)." }
          gh run download $env:PREPARATION_RUN --repo codepetca/zero --name "zero-0.5.91-portable-bundled-$env:PREPARATION_RUN" --dir prepared
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed.' }
      - name: Download pinned old Java extension
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/redhat-developer/vscode-java/releases/download/v1.57.0/vscode-java-1.57.0-1110.vsix' -OutFile old-java.vsix
          if ((Get-FileHash old-java.vsix -Algorithm SHA256).Hash.ToLowerInvariant() -ne '80a6b852577aec37510b1f975e188279181e8c30ab5cae88812d941cd2d11bff') { throw 'Old VSIX hash mismatch.' }
      - name: Trial seeded profile
        shell: powershell
        run: |
          $bundle = @(Get-ChildItem prepared -Filter '*-bundled-x64.zip')
          if ($bundle.Count -ne 1) { throw 'Expected one Complete ZIP.' }
          & ./scripts/test-windows-portable.ps1 -Bundle $bundle[0].FullName -OutputDirectory .verification/portable-qa -SeedJavaVsix (Resolve-Path old-java.vsix).Path
      - name: Retain receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-091-qa-${{ github.run_id }}
          path: |
            .verification/portable-qa/report.json
            .verification/portable-qa/*-screen.png
          if-no-files-found: warn

