name: Zero Windows Store browser cache verification
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  store-browser-build:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the original Store submission candidate
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 44652494517 --repo codepetca/zero --name zero-windows-msix-44652494517-1 --dir msix
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the original candidate.' }
          $file = 'msix/Zero-0.5.84-msix-store-x64.msix'
          $expected = '28cce4e9f0c30eb7601f437d083a1e0cf20df283770baaec5729d4808469f158'
          if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) { throw 'Store candidate hash mismatch.' }

      - name: Install the Store package and run the browser build regression
        shell: powershell
        timeout-minutes: 18
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-msix.ps1 -Package 'msix/Zero-0.5.84-msix-store-x64.msix' -PackageVersion '1.5.84.0' -Receipt 'msix/install.json' -RunFirstRun -RequireGit
          $receipt = Get-Content -LiteralPath 'msix/install.json' -Raw | ConvertFrom-Json
          if (-not $receipt.installVerified -or $receipt.firstRun.result -ne 'passed') { throw 'Store candidate installation was not verified.' }
