name: Read-only public starter API probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public starter reads from this runner
        env:
          ZERO_STARTER_PROBE_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://api.github.com/repos/codepetca/zero-starter';
          const token=process.env.ZERO_STARTER_PROBE_TOKEN;
          assert.ok(token?.length, 'GitHub did not issue a read-only workflow token');
          for (const mode of ['anonymous','workflow-token']) {
            const headers={Accept:'application/vnd.github+json','Cache-Control':'no-cache'};
            if (mode==='workflow-token') headers.Authorization='Bearer '+token;
            const get=async route=>{
              const response=await fetch(root+route,{headers,redirect:'error',signal:AbortSignal.timeout(12000)});
              const data=await response.json();
              console.log(JSON.stringify({mode,resource:route.split('?')[0].split('/').slice(0,3).join('/') || 'repository',
                status:response.status,remaining:response.headers.get('x-ratelimit-remaining'),
                rateLimited:/rate limit/i.test(data.message || '')}));
              if (mode==='workflow-token') assert.ok(response.ok,'Read-only workflow token cannot access the public starter endpoint');
              return response.ok ? data : null;
            };
            const [repo,branch]=await Promise.all([get(''),get('/branches/main')]);
            if (!repo || !branch) continue;
            assert.equal(repo.full_name,'codepetca/zero-starter');
            assert.equal(repo.private,false);
            assert.equal(repo.is_template,true);
            assert.equal(repo.default_branch,'main');
            const tree=branch.commit.commit.tree.sha;
            assert.match(tree,/^[a-f0-9]{40}$/);
            await get('/git/trees/'+tree+'?recursive=1');
          }
          NODE
