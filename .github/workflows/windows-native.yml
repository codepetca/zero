name: Zero 0.5.84 Store publishing diagnostic
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report-9:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the original Store submission candidate
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download 44652494517 --repo codepetca/zero --name zero-windows-msix-44652494517-1 --dir msix
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the original candidate.' }
          $file = 'msix/Zero-0.5.84-msix-store-x64.msix'
          $expected = '28cce4e9f0c30eb7601f437d083a1e0cf20df283770baaec5729d4808469f158'
          if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) { throw 'Store candidate hash mismatch.' }

      - name: Install and open a test-signed copy
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-msix.ps1 -Package 'msix/Zero-0.5.84-msix-store-x64.msix' -PackageVersion '1.5.84.0' -Receipt 'msix/install.json' -RunFirstRun -RequireGit
          $receipt = Get-Content -LiteralPath 'msix/install.json' -Raw | ConvertFrom-Json
          if (-not $receipt.installVerified -or $receipt.firstRun.result -ne 'passed') { throw 'Store candidate installation was not verified.' }

      - name: Test browser preflight and local build with the installed runtimes
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'ZeroStudioStoreData'),
            (Join-Path $env:LOCALAPPDATA 'Packages\Codepet.zerostudio_g62pw1js6rhjp\LocalCache\Local\ZeroStudioStoreData')
          )
          $installed = @($roots | Where-Object {
            Test-Path -LiteralPath (Join-Path $_ 'editor\extensions\zero.zero-0.5.84\package.json') -PathType Leaf
          })
          if ($installed.Count -ne 1) { throw 'Expected one Zero 0.5.84 Store editor profile.' }
          $root = $installed[0]
          $expectedKit = 'a93a9ef61a5e3f3a3c52a02b4e6662c39e3b734f8f4dcdef501f6ffe0912fe88'
          $kit = Join-Path ($root + '-embedded-kits') $expectedKit
          $manifest = Get-Content -LiteralPath (Join-Path $kit 'setup\windows-downloads.json') -Raw | ConvertFrom-Json
          $nodePin = $manifest.architectures.x64.node
          if ($nodePin.version -ne '22.23.4' -or $nodePin.sha256 -notmatch '^[a-f0-9]{64}$') { throw 'Unexpected private Node pin.' }
          $node = Join-Path $root ("runtime\node-" + $nodePin.sha256 + "\node.exe")
          if (-not (Test-Path -LiteralPath $node -PathType Leaf)) { throw 'Store setup did not install private Node.' }
          $env:ZERO_WINDOWS_DISTRIBUTION = 'store'
          $env:ZERO_KIT_DIR = $kit
          $env:ZERO_NODE_EXECUTABLE = $node
          $env:ZERO_JAVA_HOME = Join-Path $root ("runtime\jdk-" + $manifest.architectures.x64.jdk.sha256)
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & $node ./scripts/diagnose-store-publish-084.cjs (Join-Path $root 'editor\extensions\zero.zero-0.5.84') (Join-Path $kit 'starter') windows-build
          if ($LASTEXITCODE -ne 0) { throw 'The local browser publishing diagnostic failed.' }
