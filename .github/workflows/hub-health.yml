name: ZeroHub health checks

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-hub-health
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'codepetca/zero' && github.ref == 'refs/heads/main' && vars.ZERO_HUB_MONITOR_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: zerohub-operations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Install pinned database tooling
        run: npm ci --prefix hub --ignore-scripts
      - name: Check aggregate health without logging private metrics
        run: node hub/service/operations-cli.mjs --alerts-only
        env:
          NODE_ENV: production
          ZERO_HUB_MONITOR_ENABLED: '1'
          ZERO_HUB_API_DATABASE_URL: ${{ secrets.ZERO_HUB_MONITOR_API_DATABASE_URL }}
